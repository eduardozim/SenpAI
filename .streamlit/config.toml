[server]
# Proteções de segurança de rede e requisições
enableCORS = true
enableXsrfProtection = true

# Limite padrão para servidor Web / Nuvem (1 GB = 1024 MB)
# Em execução local (Desktop / Dojo), o limite é elevado dinamicamente para 50 GB no app.py
maxUploadSize = 1024
maxMessageSize = 1024

[browser]
gatherUsageStats = false
